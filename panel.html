<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Wallpaper</title>
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #141416;
    --line: #242428;
    --text: #ececee;
    --muted: #8c8c93;
    --danger: #e5736b;
    --aspecto: __ANCHO__ / __ALTO__;   /* proporción de la pantalla (la rellena main.py) */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 48px 20px 96px; }
  header { margin-bottom: 40px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  section { margin-bottom: 40px; }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 500; color: var(--muted); }

  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* Botones */
  .btn {
    font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 9px;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    cursor: pointer; transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover { background: #1c1c1f; border-color: #34343a; }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
  .btn.primary:hover { background: #fff; }
  .btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
  .link {
    font: inherit; font-size: 13px; padding: 2px 0; border: 0; background: none;
    color: var(--muted); cursor: pointer; text-decoration: none; transition: color .15s;
  }
  .link:hover { color: var(--text); }
  .link.danger:hover { color: var(--danger); }

  /* Enlace del atajo */
  .url {
    display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .url code {
    flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; user-select: all;
    font: 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  /* Fondos */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 24px 16px; }
  .card { margin: 0; }
  .thumb {
    display: block; width: 100%; aspect-ratio: var(--aspecto); object-fit: cover;
    border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  }
  .thumb.none {
    display: flex; align-items: center; justify-content: center;
    border-style: dashed; border-color: #34343a; background: transparent; color: var(--muted); font-size: 13px;
  }
  .card.on .thumb { outline: 1.5px solid var(--text); outline-offset: 3px; }
  .card figcaption { margin-top: 12px; }
  .name { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; gap: 14px; margin-top: 2px; }
  .state { font-size: 13px; color: var(--text); }

  /* Subir */
  .drop {
    display: flex; align-items: center; justify-content: center; min-height: 96px; padding: 16px;
    border: 1px dashed #34343a; border-radius: 14px; color: var(--muted); text-align: center;
    cursor: pointer; transition: border-color .15s, color .15s; word-break: break-all;
  }
  .drop:hover, .drop.over { border-color: var(--text); color: var(--text); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  input[type="text"] {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  input[type="text"]::placeholder { color: var(--muted); }

  /* Recorte */
  #recorte { margin-top: 16px; }
  .nota { margin: 0; color: var(--muted); font-size: 13px; }
  .stage {
    position: relative; width: 100%; max-width: 340px; margin: 12px auto; line-height: 0;
    border-radius: 12px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .stage img { display: block; width: 100%; height: auto; pointer-events: none; }
  .marco {
    position: absolute; border: 1.5px solid #fff; border-radius: 3px; cursor: grab; touch-action: none;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .62);
  }
  .marco:active { cursor: grabbing; }
  .zoom { display: flex; align-items: center; gap: 12px; max-width: 340px; margin: 0 auto 8px; color: var(--muted); font-size: 13px; }
  .zoom input { flex: 1; accent-color: var(--text); }
  .centro { text-align: center; }

  /* Aviso */
  #aviso {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0;
    padding: 10px 18px; border-radius: 999px; background: var(--text); color: var(--bg);
    font-size: 13px; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 40px);
  }
  #aviso.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Wallpaper</h1>
    <p class="sub">Fondo de la pantalla de bloqueo</p>
  </header>

  <section>
    <h2>Enlace del atajo</h2>
    <div class="url">
      <code id="url"></code>
      <button class="btn" id="copiar" type="button">Copiar</button>
    </div>
  </section>

  <section>
    <h2>Fondos</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <h2>Subir imagen</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" hidden>
      <span id="dropTxt">Elegir una imagen o arrastrarla aquí</span>
    </label>

    <div id="recorte" hidden>
      <p class="nota"><span id="cropNota"></span> Arrastra el marco para elegir la parte que se verá.</p>
      <div class="stage" id="stage">
        <img id="prev" alt="">
        <div class="marco" id="marco"></div>
      </div>
      <div class="zoom"><label for="zoom">Zoom</label><input type="range" id="zoom" min="35" max="100" value="100"></div>
      <div class="centro"><button class="link" id="sinRecorte" type="button">Usar la imagen completa</button></div>
    </div>

    <div class="row">
      <input type="text" id="nombre" placeholder="Nombre (opcional)" autocomplete="off" autocapitalize="off">
      <button class="btn primary" id="subir" type="button" disabled>Subir</button>
    </div>
  </section>
</main>
<div id="aviso" role="status"></div>

<script>
(() => {
  const ASPECTO = __ANCHO__ / __ALTO__;
  const $ = s => document.querySelector(s);
  let archivo = null;
  let crop = null;    // {ar, z, px, py}: relación de la imagen, zoom y posición del marco (fracciones 0 a 1)
  let arrastre = null;

  function aviso(texto) {
    const a = $('#aviso');
    a.textContent = texto;
    a.classList.add('show');
    clearTimeout(aviso.t);
    aviso.t = setTimeout(() => a.classList.remove('show'), 2600);
  }

  // ---- red (con token opcional: el servidor lo pide solo si PANEL_TOKEN está definido)
  async function api(url, opts = {}, reintento = false) {
    const r = await fetch(url, {...opts, headers: {'x-token': localStorage.tok || ''}});
    if (r.status === 401 && !reintento) {
      const t = prompt('Token del panel');
      if (t) { localStorage.tok = t; return api(url, opts, true); }
    }
    return r;
  }
  async function detalle(r) {
    try { const d = (await r.json()).detail; return typeof d === 'string' ? d : 'datos inválidos'; }
    catch { return r.statusText; }
  }
  async function accion(url, opts, ok) {
    const r = await api(url, opts);
    aviso(r.ok ? ok : 'Error: ' + await detalle(r));
    await cargar();
    return r.ok;
  }

  // ---- lista de fondos
  function tarjeta(n, activo) {
    const miniatura = n === 'ninguno'
      ? '<div class="thumb none">Sin imagen</div>'
      : `<img class="thumb" src="/fondos/${n}" alt="${n}" loading="lazy">`;
    return `<figure class="card${activo ? ' on' : ''}">
      ${miniatura}
      <figcaption>
        <span class="name">${n === 'ninguno' ? 'Diseño original' : n}</span>
        <span class="acts">
          ${activo ? '<span class="state">En uso</span>' : `<button class="link" data-a="usar" data-n="${n}">Usar</button>`}
          <a class="link" href="/wallpaper?fondo=${n}" target="_blank" rel="noopener">Ver</a>
          ${n === 'ninguno' ? '' : `<button class="link danger" data-a="borrar" data-n="${n}">Eliminar</button>`}
        </span>
      </figcaption>
    </figure>`;
  }
  async function cargar() {
    const d = await (await fetch('/fondos')).json();
    const activo = d.activo || 'ninguno';
    $('#grid').innerHTML = ['ninguno', ...d.fondos].map(n => tarjeta(n, n === activo)).join('');
  }
  $('#grid').addEventListener('click', e => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    const n = b.dataset.n;
    if (b.dataset.a === 'usar') {
      accion(`/fondos/${n}/activar`, {method: 'POST'}, n === 'ninguno' ? 'Sin imagen de fondo' : `Fondo en uso: ${n}`);
    } else if (b.dataset.armado) {                       // segundo clic: confirmar
      accion(`/fondos/${n}`, {method: 'DELETE'}, 'Fondo eliminado');
    } else {                                             // primer clic: pedir confirmación
      b.dataset.armado = '1'; b.textContent = 'Confirmar';
      setTimeout(() => { delete b.dataset.armado; b.textContent = 'Eliminar'; }, 3000);
    }
  });

  // ---- enlace del atajo
  $('#url').textContent = location.origin + '/wallpaper';
  $('#copiar').addEventListener('click', async () => {
    const texto = $('#url').textContent;
    try { await navigator.clipboard.writeText(texto); }
    catch {                                              // http en red local: no hay API de portapapeles
      const a = document.createElement('textarea');
      a.value = texto; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove();
    }
    aviso('Enlace copiado');
  });

  // ---- recorte
  function tam() {                                       // tamaño del marco (fracción de la imagen)
    const base = crop.ar > ASPECTO ? {w: ASPECTO / crop.ar, h: 1} : {w: 1, h: crop.ar / ASPECTO};
    return {w: base.w * crop.z, h: base.h * crop.z};
  }
  function pintar() {
    const t = tam();
    crop.px = Math.min(Math.max(crop.px, 0), 1 - t.w);
    crop.py = Math.min(Math.max(crop.py, 0), 1 - t.h);
    Object.assign($('#marco').style, {
      left: crop.px * 100 + '%', top: crop.py * 100 + '%', width: t.w * 100 + '%', height: t.h * 100 + '%',
    });
  }
  function iniciarRecorte(ar) {
    crop = {ar, z: 1, px: 0, py: 0};
    const t = tam();
    crop.px = (1 - t.w) / 2; crop.py = (1 - t.h) / 2;
    $('#zoom').value = 100;
    $('#cropNota').textContent = ar > ASPECTO ? 'La imagen es más ancha que la pantalla.' : 'La imagen es más alta que la pantalla.';
    $('#recorte').hidden = false;
    pintar();
  }
  function cerrarRecorte() { crop = null; $('#recorte').hidden = true; }

  const marco = $('#marco');
  marco.addEventListener('pointerdown', e => {
    marco.setPointerCapture(e.pointerId);
    arrastre = {x: e.clientX, y: e.clientY, px: crop.px, py: crop.py};
  });
  marco.addEventListener('pointermove', e => {
    if (!arrastre || !crop) return;
    const r = $('#stage').getBoundingClientRect();
    crop.px = arrastre.px + (e.clientX - arrastre.x) / r.width;
    crop.py = arrastre.py + (e.clientY - arrastre.y) / r.height;
    pintar();
  });
  ['pointerup', 'pointercancel'].forEach(ev => marco.addEventListener(ev, () => { arrastre = null; }));

  $('#zoom').addEventListener('input', e => {            // el zoom mantiene el centro del marco
    if (!crop) return;
    const t = tam(), cx = crop.px + t.w / 2, cy = crop.py + t.h / 2;
    crop.z = e.target.value / 100;
    const n = tam();
    crop.px = cx - n.w / 2; crop.py = cy - n.h / 2;
    pintar();
  });
  $('#sinRecorte').addEventListener('click', cerrarRecorte);

  // ---- elegir y subir
  function elegir(f) {
    if (!f.type.startsWith('image/')) return aviso('Elige un archivo de imagen');
    archivo = f;
    $('#dropTxt').textContent = f.name;
    $('#subir').disabled = false;
    const img = $('#prev');
    if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    img.onload = () => {
      const ar = img.naturalWidth / img.naturalHeight;
      if (Math.abs(ar / ASPECTO - 1) > 0.04) iniciarRecorte(ar); else cerrarRecorte();
    };
    img.onerror = cerrarRecorte;                         // formato que el navegador no sabe mostrar
    img.src = URL.createObjectURL(f);
  }
  const zona = $('#drop'), entrada = $('#file');
  entrada.addEventListener('change', () => entrada.files[0] && elegir(entrada.files[0]));
  ['dragenter', 'dragover'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.remove('over'); }));
  zona.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) elegir(f); });

  $('#subir').addEventListener('click', async () => {
    if (!archivo) return;
    const f = new FormData();
    f.append('archivo', archivo);
    f.append('nombre', $('#nombre').value);
    if (crop) {
      const t = tam();
      f.append('x0', Math.max(0, crop.px));
      f.append('y0', Math.max(0, crop.py));
      f.append('x1', Math.min(1, crop.px + t.w));
      f.append('y1', Math.min(1, crop.py + t.h));
    }
    $('#subir').disabled = true;
    if (await accion('/fondos', {method: 'POST', body: f}, 'Imagen subida')) {
      archivo = null; entrada.value = ''; $('#nombre').value = '';
      $('#dropTxt').textContent = 'Elegir una imagen o arrastrarla aquí';
      cerrarRecorte();
    } else {
      $('#subir').disabled = false;
    }
  });

  cargar();
})();
</script>
</body>
</html>
